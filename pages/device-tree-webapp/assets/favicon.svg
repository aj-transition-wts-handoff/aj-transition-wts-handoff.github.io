<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" />
  
  <!-- CPU/Chip Icon -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#fff" stroke-width="3" rx="3"/>
  
  <!-- Connection Points (GPIO-like) -->
  <line x1="20" y1="40" x2="30" y2="40" stroke="#fff" stroke-width="2"/>
  <line x1="20" y1="50" x2="30" y2="50" stroke="#fff" stroke-width="2"/>
  <line x1="20" y1="60" x2="30" y2="60" stroke="#fff" stroke-width="2"/>
  
  <line x1="70" y1="40" x2="80" y2="40" stroke="#fff" stroke-width="2"/>
  <line x1="70" y1="50" x2="80" y2="50" stroke="#fff" stroke-width="2"/>
  <line x1="70" y1="60" x2="80" y2="60" stroke="#fff" stroke-width="2"/>
  
  <line x1="40" y1="20" x2="40" y2="30" stroke="#fff" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="30" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="20" x2="60" y2="30" stroke="#fff" stroke-width="2"/>
  
  <line x1="40" y1="70" x2="40" y2="80" stroke="#fff" stroke-width="2"/>
  <line x1="50" y1="70" x2="50" y2="80" stroke="#fff" stroke-width="2"/>
  <line x1="60" y1="70" x2="60" y2="80" stroke="#fff" stroke-width="2"/>
  
  <!-- Center Grid Pattern -->
  <line x1="35" y1="45" x2="45" y2="45" stroke="#fff" stroke-width="1.5"/>
  <line x1="55" y1="45" x2="65" y2="45" stroke="#fff" stroke-width="1.5"/>
  <line x1="35" y1="55" x2="45" y2="55" stroke="#fff" stroke-width="1.5"/>
  <line x1="55" y1="55" x2="65" y2="55" stroke="#fff" stroke-width="1.5"/>
  
  <line x1="45" y1="35" x2="45" y2="45" stroke="#fff" stroke-width="1.5"/>
  <line x1="55" y1="35" x2="55" y2="45" stroke="#fff" stroke-width="1.5"/>
  <line x1="45" y1="55" x2="45" y2="65" stroke="#fff" stroke-width="1.5"/>
  <line x1="55" y1="55" x2="55" y2="65" stroke="#fff" stroke-width="1.5"/>
</svg>
