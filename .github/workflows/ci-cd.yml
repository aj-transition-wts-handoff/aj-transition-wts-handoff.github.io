name: CI/CD - Test and Deploy

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================
  # TESTING JOBS
  # ============================================
  
  html-validation:
    name: HTML5 Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate All HTML Files
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./
          css: false
          blacklist: backup node_modules .git
          extra: --ignore-re 'Attribute.*not allowed'

  link-check:
    name: Check Broken Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Links in All Pages
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --accept 200,403,429 --exclude-path backup --exclude-path node_modules --exclude 'https://jira\.xilinx\.com/.*' --exclude 'https://www\.te\.com/.*' './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  lighthouse-tests:
    name: Lighthouse Performance & Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install http-server
        run: npm install -g http-server
      
      - name: Start Server
        run: |
          http-server -p 8080 &
          sleep 5
      
      - name: Lighthouse CI - All Pages
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/pages/jenkins-automation.html
            http://localhost:8080/pages/playbook.html
            http://localhost:8080/pages/ethernet-interfaces.html
            http://localhost:8080/pages/cases-dashboard.html
            http://localhost:8080/pages/ar-list.html
            http://localhost:8080/pages/cq-list.html
            http://localhost:8080/pages/cr-list.html
            http://localhost:8080/pages/boardfarm-resources/boardfarm.html
            http://localhost:8080/pages/device-tree-webapp/index.html
          uploadArtifacts: false
          temporaryPublicStorage: false

  e2e-tests:
    name: End-to-End Testing (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Playwright Tests
        run: npx playwright test
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  accessibility-check:
    name: Accessibility Testing (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Axe Accessibility Tests
        run: |
          npx axe http://localhost:8080/index.html http://localhost:8080/pages/cases-dashboard.html http://localhost:8080/pages/cq-list.html http://localhost:8080/pages/cr-list.html http://localhost:8080/pages/ethernet-interfaces.html http://localhost:8080/pages/jenkins-automation.html http://localhost:8080/pages/boardfarm-resources/boardfarm.html http://localhost:8080/pages/device-tree-webapp/index.html --exit
          echo "Note: ar-list.html and playbook.html excluded from axe testing due to documented false positives"

  cross-browser-tests:
    name: Cross-Browser Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}

  mobile-responsive-check:
    name: Mobile Responsiveness Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Mobile Tests
        run: npx playwright test tests/mobile.spec.js

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # MERGE TO DEPLOY BRANCH
  # ============================================
  
  merge-to-deploy:
    name: Merge to Deploy Branch
    runs-on: ubuntu-latest
    needs: 
      - html-validation
      - link-check
      - lighthouse-tests
      - e2e-tests
      - accessibility-check
      - cross-browser-tests
      - mobile-responsive-check
      - security-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Merge to Deploy Branch
        run: |
          # Fetch all branches
          git fetch origin
          
          # Check if deploy branch exists
          if git ls-remote --heads origin deploy | grep deploy; then
            echo "Deploy branch exists, checking out..."
            git checkout deploy
            git pull origin deploy
          else
            echo "Creating deploy branch..."
            git checkout -b deploy
          fi
          
          # Merge main/master into deploy
          git merge origin/${{ github.ref_name }} --no-ff -m "Auto-merge: ${{ github.ref_name }} → deploy (CI passed)"
          
          # Push to deploy branch
          git push origin deploy

  # ============================================
  # GITHUB PAGES DEPLOYMENT
  # ============================================
  
  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest
    needs: merge-to-deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Deploy Branch
        uses: actions/checkout@v4
        with:
          ref: deploy
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
