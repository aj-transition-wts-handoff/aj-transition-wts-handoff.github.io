name: QA Automation - All Pages

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger

jobs:
  html-validation:
    name: HTML5 Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate All HTML Files
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: ./
          css: false
          blacklist: backup node_modules .git
          extra: --ignore-re 'Attribute.*not allowed'

  link-check:
    name: Check Broken Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Links in All Pages
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --accept 200,403,429 --exclude-path backup --exclude-path node_modules './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  lighthouse-tests:
    name: Lighthouse Performance & Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install http-server
        run: npm install -g http-server
      
      - name: Start Server
        run: |
          http-server -p 8080 &
          sleep 5
      
      - name: Lighthouse CI - All Pages
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/pages/jenkins-automation.html
            http://localhost:8080/pages/playbook.html
            http://localhost:8080/pages/ethernet-interfaces.html
            http://localhost:8080/pages/cases-dashboard.html
            http://localhost:8080/pages/ar-list.html
            http://localhost:8080/pages/cq-list.html
            http://localhost:8080/pages/cr-list.html
          uploadArtifacts: true
          temporaryPublicStorage: true

  e2e-tests:
    name: End-to-End Testing (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Playwright Tests
        run: npx playwright test
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  accessibility-check:
    name: Accessibility Testing (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Axe Accessibility Tests
        run: |
          npx axe http://localhost:8080/index.html --exit
          npx axe http://localhost:8080/pages/jenkins-automation.html --exit
          npx axe http://localhost:8080/pages/playbook.html --exit
          npx axe http://localhost:8080/pages/ethernet-interfaces.html --exit
          npx axe http://localhost:8080/pages/cases-dashboard.html --exit
          npx axe http://localhost:8080/pages/ar-list.html --exit
          npx axe http://localhost:8080/pages/cq-list.html --exit
          npx axe http://localhost:8080/pages/cr-list.html --exit

  cross-browser-tests:
    name: Cross-Browser Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}

  mobile-responsive-check:
    name: Mobile Responsiveness Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Mobile Tests
        run: npx playwright test tests/mobile.spec.js

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
