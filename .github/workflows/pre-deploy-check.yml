name: Pre-Deploy Quality Check

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ develop, staging ]

jobs:
  quick-check:
    name: Quick Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      
      - name: Start Test Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run Critical Tests Only
        run: npx playwright test tests/common-features.spec.js --project=chromium
      
      - name: HTML Validation
        run: npm run validate:html
        continue-on-error: true
      
      - name: Check for Broken Links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'
        continue-on-error: true

  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: quick-check
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps
      
      - name: Start Server
        run: |
          npx http-server -p 8080 &
          sleep 5
      
      - name: Run All Tests
        run: npm test
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🧪 QA Test Results\n\n';
            
            try {
              const results = fs.readFileSync('test-results.json', 'utf8');
              const data = JSON.parse(results);
              const stats = data.stats || {};
              const passed = stats.expected || 0;
              const failed = stats.unexpected || 0;
              const skipped = stats.skipped || 0;
              
              comment += `✅ Tests Passed: ${passed}\n`;
              comment += `❌ Tests Failed: ${failed}\n`;
              comment += `⏭️ Tests Skipped: ${skipped}\n`;
              comment += `\n[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            } catch (error) {
              comment += `⚠️ Could not read test results: ${error.message}\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: quick-check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Netlify Preview
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: '.'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
