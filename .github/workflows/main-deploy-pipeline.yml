name: Production Deploy Pipeline

on:
  push:
    branches: [ deploy ]  # Only deploy from deploy branch
  workflow_dispatch:  # Manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Step 1: Run QA Checks
  qa-checks:
    name: 🧪 Run QA Checks
    uses: ./.github/workflows/qa-checks.yml
    permissions:
      contents: read

  # Step 2: Pre-Deploy Check
  pre-deploy-check:
    name: 🔍 Pre-Deploy Check
    needs: qa-checks
    uses: ./.github/workflows/pre-deploy-check.yml
    permissions:
      contents: read

  # Step 3: Deploy to GitHub Pages
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: pre-deploy-check
    uses: ./.github/workflows/jekyll-gh-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
